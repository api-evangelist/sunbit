id_prefixes: none published
id_formats:
  purchaseId: opaque string; observed as numeric ("39325178") and hyphenated ("99-999-999")
  location: integrator-assigned string
  customerId: integer, read-only, only in the detailed report

observations:
- Customer is not an addressable resource — there is no GET /customer, and the only customer
  identifier (customerId) appears solely in a report row.
- Offer is not addressable either; it is only observable via webhook or report.
- The same logical address is modelled twice with different field names (AddressDetails vs
  ShippingAddress).
- District/region manager hierarchy exists in the offer-history report but nowhere in the
  onboarding model, so it cannot be set or read through the API.
