    Sunbit's official JavaScript SDK. Exposes SUNBIT.init, SUNBIT.UI.asLowAs,
    SUNBIT.UI.asLowAsWithLink, SUNBIT.UI.checkFinancingLink, SUNBIT.UI.checkoutElement,
    SUNBIT.epay.init / SUNBIT.epay.checkout, and SUNBIT.PaymentPathModule. See
    components/sunbit-components.yml for the full surface.

