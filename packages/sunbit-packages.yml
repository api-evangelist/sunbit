gaps:
- No server-side SDK in any language, despite the API being explicitly designed as a
  server-to-server integration (checkout initialization, void, refund, onboarding and
  reporting all require the secret and must run server-side).
- The one shipped library is unversioned and unpinnable — no semver, no registry, no
  subresource integrity hash.
- No public source repository for the SDK or for reference implementations.
