source: >-
  registry searches of npm, PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist and
  crates.io, plus the GitHub API and Sunbit's own SDK documentation
note: >-
  Sunbit ships exactly one first-party client library: a hosted browser SDK delivered from its
  own CDN. It publishes nothing to any package registry and operates no public GitHub
  organization, so there is no installable, pinnable, or auditable package for any
  server-side language.

