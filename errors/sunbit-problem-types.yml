coverage:
  problems: 44
  operations_with_documented_errors: 12
  statuses_used: [400, 401, 403, 404, 409, 422, 500]
  operations_without_a_documented_error_table:
  - PUT /epay/api/v1/epay/cancel/{purchaseId}
