# --- Merchant onboarding: POST /onboarding/api/v1/location
- status: 400
  title: Bad Request
  detail: Missing or invalid input, or sendSMS is true but no representative phone number provided
  operation: POST /onboarding/api/v1/location
  source: https://docs.sunbit.com/docs/onboarding/adding-new-location
- status: 401
  title: Unauthorized
  detail: sunbit-key and/or sunbit-secret do not match any alliance credentials
  operation: POST /onboarding/api/v1/location
  note: >-
    The onboarding service returns 401 for credential failure where /epay, /purchase and
    /reports return 403 for the same condition.
  source: https://docs.sunbit.com/docs/onboarding/adding-new-location
- status: 409
  title: Conflict
  detail: Same location was already added for this alliance
  operation: POST /onboarding/api/v1/location
  remediation: >-
    Onboarding is not idempotent — call GET /onboarding/api/v1/location/{location} to read the
    existing application instead of re-posting.
  source: https://docs.sunbit.com/docs/onboarding/adding-new-location
- status: 422
  title: Unprocessable Entity
  detail: Vertical parameter is not supported
  operation: POST /onboarding/api/v1/location
  remediation: >-
    vertical must be one of the 14 published values (Car_Dealerships, Car_Services, Veterinary,
    Motorsports_Parts_and_Services, Dental, Eyewear, Home_Services, Med_Spa, Bridal,
    General_Retail, Jewelry_and_Watches, Legal_Services, Medical_Office, Hospital_Health_System).
  source: https://docs.sunbit.com/docs/onboarding/adding-new-location
- status: 422
  title: Unprocessable Entity
  detail: State is not supported
  operation: POST /onboarding/api/v1/location
  remediation: >-
    Sunbit is unavailable in U.S. territories, and in WV for Home Services.
  source: https://docs.sunbit.com/docs/onboarding/adding-new-location
