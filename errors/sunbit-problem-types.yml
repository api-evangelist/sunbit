rfc9457: false
note: >-
  Sunbit publishes an Errors table on each API reference page rather than a single error
  registry, and publishes no OpenAPI. Every row below is transcribed verbatim from the
  Errors section of the cited documentation page. Sunbit does not use
  application/problem+json and emits no problem `type` URI, so there is no RFC 9457 type to
  record — the identity of an error is the (status, message) pair, and on the newer
  /alliance service a SCREAMING_SNAKE `code`.

envelopes:
- name: short
  fields: [message, code]
  example: '{"message": "Bad credentials", "code": "forbidden"}'
- name: long
  fields: [code, message, description]
  example: >-
    {"code": "UNAUTHORIZED", "message": "Authentication Failed", "description": "Failed to
    authenticate the organization for the integration."}

