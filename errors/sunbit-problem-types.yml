gaps:
- Void and partial-refund publish no error table at all — the two most consequential
  money-moving operations in the API are the least documented on failure.
- No machine-readable error registry, no stable error codes on the legacy services (identity
  is a free-text message string that can change without notice).
- Credential failure is 401 on two services and 403 on four others.
- No RFC 9457 application/problem+json, no problem type URIs.
