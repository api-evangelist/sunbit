    - POST /onboarding/api/v1/location
    - GET /onboarding/api/v1/location/{location}
  - service: reports
    version: v1
    operations:
    - GET /reports/api/v1/summary
    - GET /reports/api/v1/detailed
    - GET /reports/api/v1/customer-offer-history
  - service: alliance
