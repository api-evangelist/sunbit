  provider: Atlassian Statuspage
  page_id: 0hhnmgdmfcjt
  api: https://status.sunbit.com/api/v2/summary.json
  probed: '2026-07-31'
  http_status: 200
  indicator_at_probe: none (All Systems Operational)
  components:
  - Sunbit iOS App
  - Sunbit Online Checkout
  - Sunbit On-the-Go
  - Sunbit Pre-Qualification
  - My Sunbit
  - Partner Portal
  - Services Portal
  - Sunbit Rewards
  - Sunbit Card
  note: >-
    The status page tracks nine consumer- and merchant-facing products. It does NOT break out
    the partner API services by name (epay, purchase, onboarding, reports, alliance), so an
    integrator cannot map an API failure to a component.

