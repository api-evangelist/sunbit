  header_versioning: false
  date_versioning: false
  docs: null
  note: >-
    There is no published versioning policy page. The path version is the only version signal
    and it has not moved for the documented surface; only developers-portal-service is at v2.

deprecation:
  policy_url: null
  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  mechanism: >-
    Sunbit has no deprecation policy page and emits no Sunset/Deprecation response headers.
    Deprecations are announced as inline "Important" callouts on the affected documentation
    page, naming the replacement field and a hard upgrade deadline. Because they are announced
    only in prose, a client has no runtime signal that it is calling a deprecated shape.
  notices:
  - change: request field rename
    from: advisorEmail
    to: representativeEmail
    scope: all APIs and SDKs (pre-qualification, text to pay-over-time, checkout SDK)
    deadline: '2022-12-31'
    rationale: consistency across all APIs and SDKs
    sources:
    - https://docs.sunbit.com/docs/api-integrations/sunbit-pre-qualification
    - https://docs.sunbit.com/docs/api-integrations/text-to-Pay-Over-Time-overtime
    - https://docs.sunbit.com/docs/sdk-integrations/sunbit-checkout-sdk
    - https://docs.sunbit.com/docs/webhooks/checkout-sdk
    - https://docs.sunbit.com/docs/webhooks/webhooks-text-to-pay-over-time
    - https://docs.sunbit.com/docs/webhooks/webhooks-transactions-voided-and-refunded
  - change: webhook payload field deprecated
    field: associateName
    replacement: representativeName
    deadline: '2022-12-31'
    scope: TEXT_TO_PAY_* and CHECKOUT_SDK_* webhook payloads
    status: >-
      still documented in the current payload tables and still present in the published
      examples well past the stated deadline
    sources:
    - https://docs.sunbit.com/docs/webhooks/webhooks-text-to-pay-over-time
    - https://docs.sunbit.com/docs/webhooks/checkout-sdk
  - change: webhook payload field deprecated
    field: advisorName
    replacement: representativeName
    scope: TRANSACTION_VOIDED / TRANSACTION_REFUNDED webhook payloads
    source: https://docs.sunbit.com/docs/webhooks/webhooks-transactions-voided-and-refunded
  deprecated_operations: []

change_log:
  published: false
  url: null
  note: >-
    Sunbit publishes no dated changelog or release notes for the partner API. The docs site
    (docs.sunbit.com) is a Docusaurus build with a /blog route configured but no posts, and it
    is served with meta robots noindex,nofollow. There is no RSS/Atom feed for API changes and
    no version history, so a partner learns about a change only by re-reading the docs.

