apis:
- name: Sunbit Partner API
  description: >-
    Server-to-server REST API for Sunbit partners and SaaS platforms. Covers pre-qualification links,
    "As Low As" payment estimation, Text to Pay-Over-Time SMS links, checkout transaction
    initialization and validation, transaction void and partial refund, merchant location onboarding
    and status, embedded partner-dashboard login links, and transaction/offer reporting.
    Authentication is a paired `sunbit-key` / `sunbit-secret` header credential, with some endpoints
    additionally restricted by IP allowlist. Sandbox host is api-sandbox.sunbit.com; production is
    api.sunbit.com.
  humanURL: https://docs.sunbit.com/docs/overview/overview
  baseURL: https://api.sunbit.com/
