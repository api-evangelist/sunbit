aid: sunbit
name: Sunbit
description: >-
  Sunbit is a Los Angeles based financial technology company that builds point-of-sale buy now,
  pay-over-time financing for everyday needs — auto service and dealerships, dental, eyewear,
  veterinary, med spa, home services, and general retail. Merchants and SaaS platforms integrate
  Sunbit through a partner API and a hosted JavaScript SDK covering four products: Pre-Qualification
  (send a customer a no-hard-credit-check qualification link), Sunbit Estimate (an "As Low As"
  monthly payment shown on a price, estimate or invoice), Checkout (Sunbit added as a payment method
  via a tokenized server-to-server flow and a modal), and Text to Pay-Over-Time (an SMS payment link).
  The platform also exposes merchant onboarding, transaction lookup, void and partial refund,
  reporting, and HMAC-SHA256 signed webhooks. Loans are originated through regulated bank partners.
