- name: Sunbit JavaScript SDK
  description: >-
    Hosted, asynchronously loaded browser SDK (the SUNBIT global) that renders Sunbit's client-side
    surfaces: the "As Low As" estimate text element and disclaimer, the check-financing-options
    link, the Checkout button element and hosted checkout modal, and the Payment Path module.
    Loaded from static.sunbit.com rather than a package registry, and initialized with a publishable
    sunbitKey plus a SANDBOX / DEMO / PROD mode.
  humanURL: https://docs.sunbit.com/docs/sdk-integrations/sunbit-checkout-sdk
  baseURL: https://static.sunbit.com/sdk/sunbit-sdk.js
